<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archenemy Commander</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Deckbuilder View -->
<section id="builder-view">
  <h2>Select Your Schemes (Min 10)</h2>
  
  <!-- NEW: The Set Filter Dropdown -->
  <div style="margin-bottom: 20px;">
    <label for="set-filter" style="color: white; margin-right: 10px;">Filter by Set:</label>
    <select id="set-filter" style="padding: 8px; border-radius: 4px; font-size: 1rem;">
      <option value="all">All Sets</option>
    </select>
  </div>

  <div id="card-grid"></div>
  <button id="start-game-btn" disabled>Start Game</button>
</section>

    <!-- Active Game View (Hidden Initially) -->
    <section id="play-view" style="display: none;">
      
      <!-- Multiplayer Life Tracker -->
      <div id="life-tracker-container"></div>
      
      <!-- NEW: Permanent Container for Current Scheme -->
      <div id="current-scheme-display"></div>
      
      <div id="active-schemes"></div>
      
      <div style="margin-top: 20px;">
        <button id="draw-scheme-btn">Set Scheme in Motion</button>
        <button id="reset-game-btn" style="background-color: #cf6679; margin-left: 15px;">Reset Game</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
